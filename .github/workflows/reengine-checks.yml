name: Reengine checks

on:
  # Run on every main-branch push so every deployment has a matching gate,
  # including application-only changes outside the Reengine folder.
  push:
    branches: [main]
  # Keep this check present on every PR targeting main so it can be required
  # by branch protection without being skipped by path filters.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reengine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reengine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:reengine
      - run: pnpm test:reengine
