name: Reengine checks

on:
  # Run on main and feature branches so isolated stacked reengineering slices
  # receive the same frozen-install, typecheck, and unit-test gate.
  push:
    branches: [main, "feat/**"]
  # Run on every PR, including stacked phase PRs whose base is another feature branch.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reengine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reengine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:app
      - run: pnpm typecheck:reengine
      - run: pnpm test:reengine
      - run: pnpm build
